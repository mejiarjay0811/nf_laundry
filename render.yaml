# Deploy the POS API + client to Render (https, free tier available).
#
# Render gives the service an HTTPS address, which is what lets the Android app
# work over mobile data from anywhere rather than only on the shop Wi-Fi.
#
# The three secret values are marked sync:false — Render prompts for them on
# first deploy and stores them itself. They are NEVER committed to the repo and
# never reach the phone.
services:
  - type: web
    name: nf-laundry-pos
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/system/health
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT. API_PORT must stay unset so the server uses it.
      - key: SERVE_CLIENT
        value: 'true'

      # Served over HTTPS, so the session cookie is Secure as it should be.
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'

      - key: SHEETS_PROVIDER
        value: apps-script
      - key: GOOGLE_SPREADSHEET_ID
        value: 1KjSDxY4WirVlzf-ZSv_v212EYqlo6eM71YR0xUj2PWE

      # --- prompted on first deploy, stored by Render ---
      - key: SESSION_SECRET
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_TOKEN
        sync: false
